worker_processes 1;

error_log /dev/stderr info;
pid /tmp/nginx.pid;

env OPENSSL_CONF;
ssl_engine gost;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/gost-server.crt;
        ssl_certificate_key /etc/nginx/certs/gost-server.key;

        ssl_protocols TLSv1.2;
        ssl_ciphers "GOST2012-KUZNYECHIK-KUZNYECHIKOMAC:GOST2012-MAGMA-MAGMAOMAC:IANA-GOST2012-GOST8912-GOST8912:LEGACY-GOST2012-GOST8912-GOST8912";

        location / {
            default_type text/html;
            return 200 '<!doctype html><title>GOST TLS Gateway</title><h1>GOST TLS Gateway</h1>';
        }

        location /api/ {
            proxy_pass http://host.docker.internal:8080;
        }
    }
}